<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notebook — Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1a2e;
      --paper: #f8f5f0;
      --accent: #e07b54;
      --accent2: #5c7c6e;
      --muted: #8a8a9a;
      --card: #ffffff;
      --border: #e8e4df;
      --error: #c94040;
      --success: #3d9970;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--paper);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 80% 20%, rgba(92,124,110,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 70% at 10% 80%, rgba(224,123,84,0.10) 0%, transparent 60%);
      pointer-events: none;
    }

    .wrapper {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      position: relative;
      z-index: 1;
    }

    .brand {
      text-align: center;
      margin-bottom: 36px;
    }

    .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px; height: 56px;
      background: var(--ink);
      border-radius: 16px;
      margin-bottom: 12px;
      font-size: 26px;
      transform: rotate(-4deg);
      box-shadow: 4px 4px 0 var(--accent);
    }

    .brand h1 {
      font-family: 'Fraunces', serif;
      font-size: 2rem;
      color: var(--ink);
      letter-spacing: -0.5px;
    }

    .brand p { color: var(--muted); font-size: 0.88rem; margin-top: 4px; }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 36px 32px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 40px rgba(26,26,46,0.06);
      animation: slideUp 0.4s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card h2 { font-family: 'Fraunces', serif; font-size: 1.4rem; color: var(--ink); margin-bottom: 6px; }
    .card .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 28px; }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 7px;
      letter-spacing: 0.3px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--ink);
      background: var(--paper);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    input:focus {
      border-color: var(--accent2);
      box-shadow: 0 0 0 3px rgba(92,124,110,0.12);
      background: #fff;
    }

    input::placeholder { color: var(--muted); }

    .hint {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 5px;
    }

    .btn {
      width: 100%;
      padding: 13px;
      background: var(--accent2);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
    }

    .btn:hover {
      background: var(--ink);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(26,26,46,0.25);
    }

    .btn:active { transform: translateY(0); }
    .btn.loading { pointer-events: none; opacity: 0.8; }

    .alert {
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 18px;
      display: none;
    }
    .alert.error { background: #fdf0f0; color: var(--error); border: 1px solid #f5c6c6; display: block; }
    .alert.success { background: #f0faf4; color: var(--success); border: 1px solid #b8e6cc; display: block; }

    .footer-link {
      text-align: center;
      margin-top: 22px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .footer-link a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="brand">
    <div class="brand-icon">📓</div>
    <h1>Folio</h1>
    <p>Join and start writing today</p>
  </div>

  <div class="card">
    <h2>Create account</h2>
    <p class="subtitle">Set up your personal notebook</p>

    <div id="alert" class="alert"></div>

    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Choose a username"/>
      <p class="hint">Minimum 3 characters</p>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Create a password"/>
      <p class="hint">Minimum 4 characters</p>
    </div>

    <div class="field">
      <label for="confirm">Confirm Password</label>
      <input type="password" id="confirm" placeholder="Repeat your password"/>
    </div>

    <button class="btn" id="regBtn" onclick="register()">Create Account</button>

    <div class="footer-link" style="margin-top:18px">
      Already have an account? <a href="/login.html">Sign in</a>
    </div>
  </div>
</div>

<script>
  document.getElementById('confirm').addEventListener('keypress', e => {
    if (e.key === 'Enter') register();
  });

  function showAlert(msg, type) {
    const el = document.getElementById('alert');
    el.textContent = msg;
    el.className = 'alert ' + type;
  }

  async function register() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;
    const btn = document.getElementById('regBtn');

    if (!username || !password || !confirm) {
      showAlert('Please fill in all fields.', 'error'); return;
    }
    if (username.length < 3) {
      showAlert('Username must be at least 3 characters.', 'error'); return;
    }
    if (password.length < 4) {
      showAlert('Password must be at least 4 characters.', 'error'); return;
    }
    if (password !== confirm) {
      showAlert('Passwords do not match.', 'error'); return;
    }

    btn.classList.add('loading');
    btn.textContent = 'Creating account...';

    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (res.ok) {
        showAlert('Account created! Redirecting to login...', 'success');
        setTimeout(() => window.location.href = '/login.html', 1200);
      } else {
        showAlert(data.error || 'Registration failed.', 'error');
        btn.classList.remove('loading');
        btn.textContent = 'Create Account';
      }
    } catch (e) {
      showAlert('Server error. Please try again.', 'error');
      btn.classList.remove('loading');
      btn.textContent = 'Create Account';
    }
  }
</script>
</body>
</html>
